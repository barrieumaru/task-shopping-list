<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Task & Shopping List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #root { min-height: 100vh; }
        .loading { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            font-family: system-ui;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">Loading...</div>
    </div>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        // TODO: Replace with your Firebase config from Firebase Console
        const firebaseConfig = {
            apiKey: "AIzaSyAZePctFDt6gTym5BJwhkYQ3gjIial-hZ4",
            authDomain: "task-list-app-ad928.firebaseapp.com",
            projectId: "task-list-app-ad928",
            storageBucket: "task-list-app-ad928.firebasestorage.app",
            messagingSenderId: "826721255940",
            appId: "1:826721255940:web:904884cf22184969a9eb51"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Icons
        const Plus = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Trash2 = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const Check = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        );

        const RefreshCw = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
        );

        function TaskShoppingList() {
          const [activeTab, setActiveTab] = useState('tasks');
          const [tasks, setTasks] = useState([]);
          const [shopping, setShopping] = useState([]);
          const [taskInput, setTaskInput] = useState('');
          const [shopInput, setShopInput] = useState('');
          const [loading, setLoading] = useState(true);

          // Load tasks from Firebase
          useEffect(() => {
            const unsubscribe = db.collection('tasks')
              .orderBy('createdAt', 'desc')
              .onSnapshot((snapshot) => {
                const tasksData = snapshot.docs.map(doc => ({
                  id: doc.id,
                  ...doc.data()
                }));
                setTasks(tasksData);
                setLoading(false);
              });

            return () => unsubscribe();
          }, []);

          // Load shopping items from Firebase
          useEffect(() => {
            const unsubscribe = db.collection('shopping')
              .orderBy('createdAt', 'desc')
              .onSnapshot((snapshot) => {
                const shoppingData = snapshot.docs.map(doc => ({
                  id: doc.id,
                  ...doc.data()
                }));
                setShopping(shoppingData);
              });

            return () => unsubscribe();
          }, []);

          const addTask = async () => {
            if (taskInput.trim()) {
              await db.collection('tasks').add({
                text: taskInput,
                completed: false,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
              setTaskInput('');
            }
          };

          const addShoppingItem = async () => {
            if (shopInput.trim()) {
              await db.collection('shopping').add({
                text: shopInput,
                completed: false,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
              setShopInput('');
            }
          };

          const toggleTask = async (id, currentStatus) => {
            await db.collection('tasks').doc(id).update({
              completed: !currentStatus
            });
          };

          const toggleShoppingItem = async (id, currentStatus) => {
            await db.collection('shopping').doc(id).update({
              completed: !currentStatus
            });
          };

          const deleteTask = async (id) => {
            await db.collection('tasks').doc(id).delete();
          };

          const deleteShoppingItem = async (id) => {
            await db.collection('shopping').doc(id).delete();
          };

          const handleKeyPress = (e, type) => {
            if (e.key === 'Enter') {
              type === 'task' ? addTask() : addShoppingItem();
            }
          };

          if (loading) {
            return (
              <div className="loading">
                <div className="text-center">
                  <RefreshCw size={48} className="animate-spin text-blue-600 mx-auto mb-4" />
                  <p className="text-gray-600">Loading your lists...</p>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
              <div className="max-w-2xl mx-auto">
                <div className="bg-white rounded-lg shadow-lg overflow-hidden">
                  <div className="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white">
                    <h1 className="text-3xl font-bold">Shared Lists</h1>
                    <p className="text-blue-100 mt-1">Everyone with the link can see and edit</p>
                  </div>

                  <div className="flex border-b">
                    <button
                      onClick={() => setActiveTab('tasks')}
                      className={`flex-1 py-4 font-semibold transition-colors ${
                        activeTab === 'tasks'
                          ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600'
                          : 'text-gray-600 hover:bg-gray-50'
                      }`}
                    >
                      Daily Tasks ({tasks.filter(t => !t.completed).length})
                    </button>
                    <button
                      onClick={() => setActiveTab('shopping')}
                      className={`flex-1 py-4 font-semibold transition-colors ${
                        activeTab === 'shopping'
                          ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600'
                          : 'text-gray-600 hover:bg-gray-50'
                      }`}
                    >
                      Shopping List ({shopping.filter(s => !s.completed).length})
                    </button>
                  </div>

                  <div className="p-6">
                    {activeTab === 'tasks' ? (
                      <>
                        <div className="flex gap-2 mb-6">
                          <input
                            type="text"
                            value={taskInput}
                            onChange={(e) => setTaskInput(e.target.value)}
                            onKeyPress={(e) => handleKeyPress(e, 'task')}
                            placeholder="Add a new task..."
                            className="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                          />
                          <button
                            onClick={addTask}
                            className="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-2"
                          >
                            <Plus size={20} />
                            Add
                          </button>
                        </div>

                        <div className="space-y-2">
                          {tasks.length === 0 ? (
                            <p className="text-center text-gray-400 py-8">No tasks yet. Add one to get started!</p>
                          ) : (
                            tasks.map(task => (
                              <div
                                key={task.id}
                                className="flex items-center gap-3 p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors"
                              >
                                <button
                                  onClick={() => toggleTask(task.id, task.completed)}
                                  className={`flex-shrink-0 w-6 h-6 rounded border-2 flex items-center justify-center transition-colors ${
                                    task.completed
                                      ? 'bg-green-500 border-green-500'
                                      : 'border-gray-300 hover:border-blue-500'
                                  }`}
                                >
                                  {task.completed && <Check size={16} />}
                                </button>
                                <span
                                  className={`flex-1 ${
                                    task.completed ? 'line-through text-gray-400' : 'text-gray-800'
                                  }`}
                                >
                                  {task.text}
                                </span>
                                <button
                                  onClick={() => deleteTask(task.id)}
                                  className="text-red-500 hover:text-red-700 transition-colors"
                                >
                                  <Trash2 size={18} />
                                </button>
                              </div>
                            ))
                          )}
                        </div>
                      </>
                    ) : (
                      <>
                        <div className="flex gap-2 mb-6">
                          <input
                            type="text"
                            value={shopInput}
                            onChange={(e) => setShopInput(e.target.value)}
                            onKeyPress={(e) => handleKeyPress(e, 'shopping')}
                            placeholder="Add a shopping item..."
                            className="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                          />
                          <button
                            onClick={addShoppingItem}
                            className="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-2"
                          >
                            <Plus size={20} />
                            Add
                          </button>
                        </div>

                        <div className="space-y-2">
                          {shopping.length === 0 ? (
                            <p className="text-center text-gray-400 py-8">No items yet. Add what you need!</p>
                          ) : (
                            shopping.map(item => (
                              <div
                                key={item.id}
                                className="flex items-center gap-3 p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors"
                              >
                                <button
                                  onClick={() => toggleShoppingItem(item.id, item.completed)}
                                  className={`flex-shrink-0 w-6 h-6 rounded border-2 flex items-center justify-center transition-colors ${
                                    item.completed
                                      ? 'bg-green-500 border-green-500'
                                      : 'border-gray-300 hover:border-blue-500'
                                  }`}
                                >
                                  {item.completed && <Check size={16} />}
                                </button>
                                <span
                                  className={`flex-1 ${
                                    item.completed ? 'line-through text-gray-400' : 'text-gray-800'
                                  }`}
                                >
                                  {item.text}
                                </span>
                                <button
                                  onClick={() => deleteShoppingItem(item.id)}
                                  className="text-red-500 hover:text-red-700 transition-colors"
                                >
                                  <Trash2 size={18} />
                                </button>
                              </div>
                            ))
                          )}
                        </div>
                      </>
                    )}
                  </div>

                  <div className="bg-gray-50 px-6 py-4 border-t">
                    <div className="flex justify-between text-sm text-gray-600">
                      <span>
                        {activeTab === 'tasks'
                          ? `${tasks.filter(t => t.completed).length} of ${tasks.length} completed`
                          : `${shopping.filter(s => s.completed).length} of ${shopping.length} purchased`}
                      </span>
                      <span>
                        {activeTab === 'tasks'
                          ? `${tasks.filter(t => !t.completed).length} remaining`
                          : `${shopping.filter(s => !s.completed).length} to buy`}
                      </span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // Wait for everything to load before rendering
        window.addEventListener('load', function() {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<TaskShoppingList />);
        });
    </script>
</body>
</html>
